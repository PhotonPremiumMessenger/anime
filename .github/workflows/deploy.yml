name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Site and API via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Обновляем файлы самого САЙТА (фронтенда)
            cd /var/www/nihongo
            git pull origin main
            
            # 2. Обновляем файлы БЭКЕНДА (сервера)
            cd /var/www/anilingo-server
            # Если папка сервера - это отдельный git-репозиторий (как мы делали), то:
            git pull origin main
            # Если сервер лежит в той же папке /var/www/nihongo/server, то эта строка не нужна.
            
            # 3. Если бэкенд обновился, перезапускаем его через PM2
            pm2 restart anilingo-api
