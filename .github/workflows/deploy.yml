name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Обновляем сайт
            cd /var/www/anilingo || cd /var/www/nihongo
            git pull origin main

            # 2. Обновляем сервер (бэкенд)
            cd server
            npm install --no-audit --no-fund
            pm2 restart anilingo-api || echo "PM2 не запущен"
