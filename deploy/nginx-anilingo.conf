# ============================================================
# AniLingo — пример настройки nginx для anilingo.fun
#
# Зачем этот файл: сайт перешёл на адреса без .html
# (/lessons вместо /lessons.html). Express такие адреса уже
# понимает, а nginx — нет, пока ему не скажешь.
#
# Что делает try_files:
#   1. $uri          — есть готовый файл (/css/style.css) — отдать его;
#   2. $uri.html     — нет файла, но есть /lessons.html — отдать его,
#                      адрес в строке остаётся /lessons;
#   3. $uri/         — папка с index.html;
#   4. /index.html   — запасной вариант для совсем неизвестных адресов.
#
# Куда положить: /etc/nginx/sites-available/anilingo.fun
#   sudo ln -s /etc/nginx/sites-available/anilingo.fun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Путь root поправьте на свой (часто /var/www/anilingo или /var/www/nihongo).
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name anilingo.fun www.anilingo.fun;

    # Сертификат Let's Encrypt обычно дописывает certbot
    # listen 443 ssl http2; ...

    root /var/www/anilingo;
    index index.html;

    charset utf-8;
    client_max_body_size 4m;

    # ---------- Адреса без .html ----------
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ---------- API ----------
    # Express живёт отдельным процессом на порту 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- Кеш ----------
    # HTML не кешируем: правки должны доходить сразу
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpe?g|webp|svg|gif|ico|woff2?|mp3)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---------- Сжатие ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- Безопасность ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
